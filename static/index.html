<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Finale Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-lg bg-white border border-neutral-200 rounded-xl p-8 shadow-sm">
    <div class="space-y-2 mb-6">
      <p class="text-xs font-medium uppercase tracking-wider text-neutral-500">System Foundation</p>
      <h1 class="text-2xl font-semibold tracking-tight text-neutral-900">Application Ready</h1>
      <p class="text-sm text-neutral-600">
        Base FastAPI service is running. Visual theme and domain modules will be configured once the problem statement is released.
      </p>
    </div>

    <div class="border-t border-neutral-100 pt-5 space-y-4">
      <div class="flex items-center justify-between text-sm">
        <span class="text-neutral-500">Service Status</span>
        <span id="health-status" class="font-medium text-neutral-800">Not checked</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-neutral-500">Database</span>
        <span id="db-status" class="font-medium text-neutral-800">Pending</span>
      </div>

      <button
        id="check-health-btn"
        type="button"
        class="w-full mt-2 px-4 py-2.5 text-sm font-medium text-neutral-900 bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 rounded-lg transition-colors"
      >
        Verify Health Endpoint
      </button>
    </div>
  </main>

  <script>
    const healthStatusEl = document.getElementById("health-status");
    const dbStatusEl = document.getElementById("db-status");
    const checkBtn = document.getElementById("check-health-btn");

    async function checkHealth() {
      healthStatusEl.textContent = "Checking...";
      try {
        const res = await fetch("/health");
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const data = await res.json();
        healthStatusEl.textContent = data.status === "ok" ? "Online" : String(data.status);
        dbStatusEl.textContent = data.supabase_configured ? "Configured" : "Not configured yet";
      } catch (err) {
        healthStatusEl.textContent = "Unavailable";
        dbStatusEl.textContent = "Unknown";
      }
    }

    checkBtn.addEventListener("click", checkHealth);
    checkHealth();
  </script>
</body>
</html>
