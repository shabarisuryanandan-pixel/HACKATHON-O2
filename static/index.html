<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Finale Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-orange-50/60 text-neutral-900 antialiased min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-xl bg-white border border-orange-200 rounded-xl p-8 shadow-sm">
    <div class="space-y-1.5 mb-6">
      <p class="text-xs font-semibold uppercase tracking-wider text-orange-600">System Foundation</p>
      <h1 class="text-2xl font-semibold tracking-tight text-neutral-900">Application Ready</h1>
      <p class="text-sm text-neutral-600">
        Verify live backend, SQLite, and Supabase connections before building tomorrow's solution.
      </p>
    </div>

    <!-- Manual On-Click Tabs -->
    <div class="flex border-b border-orange-100 mb-6" role="tablist">
      <button
        id="tab-diagnostics"
        type="button"
        role="tab"
        aria-selected="true"
        class="px-4 py-2 text-sm font-medium border-b-2 border-orange-600 text-orange-700 -mb-px"
      >
        Connection Diagnostics
      </button>
      <button
        id="tab-persistence"
        type="button"
        role="tab"
        aria-selected="false"
        class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-neutral-500 hover:text-orange-600 -mb-px"
      >
        SQLite Write Test
      </button>
    </div>

    <!-- Panel 1: Connection Diagnostics -->
    <section id="panel-diagnostics" class="space-y-4">
      <div class="divide-y divide-orange-100 border border-orange-200 rounded-lg px-4 bg-orange-50/30">
        <div class="py-3 flex items-center justify-between text-sm">
          <span class="text-neutral-600">FastAPI Backend</span>
          <span id="status-backend" class="font-medium text-neutral-900">Checking...</span>
        </div>
        <div class="py-3 flex items-center justify-between text-sm">
          <span class="text-neutral-600">SQLite Persistence</span>
          <span id="status-sqlite" class="font-medium text-neutral-900">Checking...</span>
        </div>
        <div class="py-3 flex items-center justify-between text-sm">
          <span class="text-neutral-600">Supabase Project</span>
          <span id="status-supabase" class="font-medium text-neutral-900">Checking...</span>
        </div>
        <div class="py-3 flex items-center justify-between text-sm">
          <span class="text-neutral-600">Environment</span>
          <span id="status-env" class="font-medium text-orange-700">-</span>
        </div>
      </div>

      <button
        id="run-diagnostics-btn"
        type="button"
        class="w-full px-4 py-2.5 text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 rounded-lg transition-colors"
      >
        Run Connection Check
      </button>
    </section>

    <!-- Panel 2: SQLite Write Test -->
    <section id="panel-persistence" class="hidden space-y-4">
      <form id="note-form" class="flex gap-2">
        <input
          id="note-input"
          type="text"
          maxlength="200"
          required
          placeholder="Enter a short test message..."
          class="flex-1 px-3 py-2 text-sm border border-orange-200 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
        />
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 rounded-lg transition-colors"
        >
          Save Record
        </button>
      </form>

      <div class="flex items-center justify-between">
        <span class="text-xs font-medium uppercase tracking-wider text-orange-700">Recent SQLite Records</span>
        <button
          id="refresh-notes-btn"
          type="button"
          class="text-xs font-medium text-orange-600 hover:text-orange-800"
        >
          Refresh
        </button>
      </div>

      <ul id="notes-list" class="divide-y divide-orange-100 border border-orange-200 rounded-lg px-4 text-sm text-neutral-700 bg-orange-50/30">
        <li class="py-3 text-neutral-400">No records loaded yet.</li>
      </ul>
    </section>
  </main>

  <script>
    const tabDiagnostics = document.getElementById("tab-diagnostics");
    const tabPersistence = document.getElementById("tab-persistence");
    const panelDiagnostics = document.getElementById("panel-diagnostics");
    const panelPersistence = document.getElementById("panel-persistence");

    const statusBackend = document.getElementById("status-backend");
    const statusSqlite = document.getElementById("status-sqlite");
    const statusSupabase = document.getElementById("status-supabase");
    const statusEnv = document.getElementById("status-env");
    const runDiagnosticsBtn = document.getElementById("run-diagnostics-btn");

    const noteForm = document.getElementById("note-form");
    const noteInput = document.getElementById("note-input");
    const notesList = document.getElementById("notes-list");
    const refreshNotesBtn = document.getElementById("refresh-notes-btn");

    function switchTab(activeTab) {
      const isDiag = activeTab === "diagnostics";
      panelDiagnostics.classList.toggle("hidden", !isDiag);
      panelPersistence.classList.toggle("hidden", isDiag);

      tabDiagnostics.setAttribute("aria-selected", String(isDiag));
      tabPersistence.setAttribute("aria-selected", String(!isDiag));

      tabDiagnostics.className = isDiag
        ? "px-4 py-2 text-sm font-medium border-b-2 border-orange-600 text-orange-700 -mb-px"
        : "px-4 py-2 text-sm font-medium border-b-2 border-transparent text-neutral-500 hover:text-orange-600 -mb-px";

      tabPersistence.className = !isDiag
        ? "px-4 py-2 text-sm font-medium border-b-2 border-orange-600 text-orange-700 -mb-px"
        : "px-4 py-2 text-sm font-medium border-b-2 border-transparent text-neutral-500 hover:text-orange-600 -mb-px";
    }

    async function runDiagnostics() {
      statusBackend.textContent = "Checking...";
      statusSqlite.textContent = "Checking...";
      statusSupabase.textContent = "Checking...";
      try {
        const res = await fetch("/api/diagnostics");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        statusBackend.textContent = data.backend?.status === "ok" ? "Online" : "Error";
        statusEnv.textContent = data.backend?.environment || "unknown";

        if (data.sqlite?.connected) {
          statusSqlite.textContent = "Connected (" + data.sqlite.record_count + " records)";
        } else {
          statusSqlite.textContent = "Disconnected";
        }

        if (data.supabase?.reachable) {
          statusSupabase.textContent = "Connected (HTTP 200)";
        } else if (data.supabase?.configured) {
          statusSupabase.textContent = "Configured (Unreachable)";
        } else {
          statusSupabase.textContent = "Not configured";
        }
      } catch (err) {
        statusBackend.textContent = "Unavailable";
        statusSqlite.textContent = "Unknown";
        statusSupabase.textContent = "Unknown";
      }
    }

    async function loadNotes() {
      try {
        const res = await fetch("/api/notes");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const notes = data.notes || [];
        notesList.innerHTML = "";
        if (notes.length === 0) {
          const li = document.createElement("li");
          li.className = "py-3 text-neutral-400";
          li.textContent = "No records saved yet.";
          notesList.appendChild(li);
          return;
        }
        notes.forEach((item) => {
          const li = document.createElement("li");
          li.className = "py-2.5 flex items-center justify-between gap-4";
          const textSpan = document.createElement("span");
          textSpan.className = "text-neutral-800 truncate";
          textSpan.textContent = item.note;
          const idSpan = document.createElement("span");
          idSpan.className = "text-xs text-orange-600 font-medium shrink-0";
          idSpan.textContent = "#" + item.id;
          li.appendChild(textSpan);
          li.appendChild(idSpan);
          notesList.appendChild(li);
        });
      } catch (err) {
        notesList.innerHTML = '<li class="py-3 text-neutral-500">Failed to load records.</li>';
      }
    }

    tabDiagnostics.addEventListener("click", () => switchTab("diagnostics"));
    tabPersistence.addEventListener("click", () => {
      switchTab("persistence");
      loadNotes();
    });

    runDiagnosticsBtn.addEventListener("click", runDiagnostics);
    refreshNotesBtn.addEventListener("click", loadNotes);

    noteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const noteText = noteInput.value.trim();
      if (!noteText) return;
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ note: noteText }),
      });
      noteInput.value = "";
      await loadNotes();
    });

    runDiagnostics();
  </script>
</body>
</html>
